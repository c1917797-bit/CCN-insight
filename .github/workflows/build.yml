name: Build and validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py
      - run: python scripts/verify.py
      - run: python scripts/verify_source_records.py
      - run: python scripts/verify_operator_research.py
      - run: python scripts/verify_operator_platform.py
      - run: python scripts/validate_insight_skills.py
      - run: python scripts/insight_topic.py self-test
      - run: python scripts/test_insight_workbench.py
      - run: python scripts/verify_expert_topics.py
      - run: python scripts/verify_expert_index.py --self-test
      - run: node scripts/test_report_reasoning.cjs
      - run: node scripts/test_expert_navigation.cjs
      - run: node scripts/test_reader_journey.cjs
      - run: node scripts/test_compression_entry.cjs
      - run: node scripts/test_topic_reader_five_rounds.cjs
      - run: python scripts/audit_compression_inventory.py --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: ccn-static-site
          path: dist/
