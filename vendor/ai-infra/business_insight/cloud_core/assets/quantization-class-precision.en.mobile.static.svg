<text x="20" y="42" font-size="30" fill="#eff8ff" font-weight="600" >First: what is a bit?</text>
<text x="20" y="94" font-size="24" fill="#b5cce2" font-weight="400" >A weight uses binary digits.</text>
<text x="20" y="146" font-size="24" fill="#eff8ff" font-weight="400" >16 bit: sixteen binary digits</text>
<rect x="20" y="175" width="16" height="35" rx="3" fill="#24455f" stroke="#81adc2" data-precision-width="16" data-bit-index="0"/>
<rect x="40" y="175" width="16" height="35" rx="3" fill="#24455f" stroke="#81adc2" data-precision-width="16" data-bit-index="1"/>
<rect x="60" y="175" width="16" height="35" rx="3" fill="#24455f" stroke="#81adc2" data-precision-width="16" data-bit-index="2"/>
<rect x="80" y="175" width="16" height="35" rx="3" fill="#24455f" stroke="#81adc2" data-precision-width="16" data-bit-index="3"/>
<rect x="100" y="175" width="16" height="35" rx="3" fill="#24455f" stroke="#81adc2" data-precision-width="16" data-bit-index="4"/>
<rect x="120" y="175" width="16" height="35" rx="3" fill="#24455f" stroke="#81adc2" data-precision-width="16" data-bit-index="5"/>
<rect x="140" y="175" width="16" height="35" rx="3" fill="#24455f" stroke="#81adc2" data-precision-width="16" data-bit-index="6"/>
<rect x="160" y="175" width="16" height="35" rx="3" fill="#24455f" stroke="#81adc2" data-precision-width="16" data-bit-index="7"/>
<rect x="180" y="175" width="16" height="35" rx="3" fill="#24455f" stroke="#81adc2" data-precision-width="16" data-bit-index="8"/>
<rect x="200" y="175" width="16" height="35" rx="3" fill="#24455f" stroke="#81adc2" data-precision-width="16" data-bit-index="9"/>
<rect x="220" y="175" width="16" height="35" rx="3" fill="#24455f" stroke="#81adc2" data-precision-width="16" data-bit-index="10"/>
<rect x="240" y="175" width="16" height="35" rx="3" fill="#24455f" stroke="#81adc2" data-precision-width="16" data-bit-index="11"/>
<rect x="260" y="175" width="16" height="35" rx="3" fill="#24455f" stroke="#81adc2" data-precision-width="16" data-bit-index="12"/>
<rect x="280" y="175" width="16" height="35" rx="3" fill="#24455f" stroke="#81adc2" data-precision-width="16" data-bit-index="13"/>
<rect x="300" y="175" width="16" height="35" rx="3" fill="#24455f" stroke="#81adc2" data-precision-width="16" data-bit-index="14"/>
<rect x="320" y="175" width="16" height="35" rx="3" fill="#24455f" stroke="#81adc2" data-precision-width="16" data-bit-index="15"/>
<text x="20" y="283" font-size="24" fill="#eff8ff" font-weight="400" >2 bit: two binary digits</text>
<rect x="101" y="313" width="64" height="45" rx="7" fill="#205264" stroke="#6ef3e2" data-precision-width="2" data-bit-index="0"/>
<rect x="181" y="313" width="64" height="45" rx="7" fill="#205264" stroke="#6ef3e2" data-precision-width="2" data-bit-index="1"/>
<text x="180" y="436" font-size="34" fill="#6ef3e2" font-weight="600" text-anchor="middle" id="precision-code-count" data-bits="2" data-code-count="4">2² = 4 short codes</text>
<text x="20" y="511" font-size="26" fill="#eff8ff" font-weight="400" >Bit width is storage size,</text>
<text x="20" y="554" font-size="26" fill="#ffb08d" font-weight="400" >not decimal places.</text>
<text x="20" y="591" font-size="24" fill="#b5cce2" font-weight="400" >2-bit teaching example.</text>
</svg>