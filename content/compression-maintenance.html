<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>推理压缩 · 统一维护台</title><style>
*{box-sizing:border-box}body{margin:0;color:#183349;background:#f1f6f8;font:15px/1.6 system-ui}header{padding:20px 32px;background:#fff;border-bottom:1px solid #d9e5eb;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:23px;margin:0}small,.muted{color:#637c8d}main{max-width:1500px;margin:auto;padding:24px}.status{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px}.pill{background:#fff;border:1px solid #dae6eb;padding:10px 16px;border-radius:10px}.layout{display:grid;grid-template-columns:350px minmax(0,1fr);gap:20px}.panel{background:#fff;border:1px solid #dae6eb;border-radius:14px;padding:22px}label{display:block;margin:12px 0 6px;font-weight:600}select,input,textarea{width:100%;padding:10px 12px;color:inherit;border:1px solid #bed0db;border-radius:7px;background:#fff;font:inherit}textarea{min-height:95px;resize:vertical;line-height:1.7}.records{max-height:480px;overflow:auto;margin-top:12px}.record{display:block;width:100%;text-align:left;background:#fff;color:#183349;padding:12px;border:0;border-bottom:1px solid #e5edf1;cursor:pointer}.record:hover,.record.active{background:#e8f5f3}.record small{display:block;overflow-wrap:anywhere}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{background:#087f80;color:white;border:0;padding:11px 18px;border-radius:8px;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}a{color:#087f80;text-decoration:none}#message{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px 0}#message.error{color:#ae3025}.field{margin:20px 0}.field small{display:block}.readonly{overflow-wrap:anywhere;background:#f4f7fa;padding:10px;border-radius:6px}#editor{min-height:350px}h2{font-size:20px;margin-top:0}.hint{background:#eef6f8;padding:12px;border-radius:7px}details{margin-top:15px}@media(max-width:850px){.layout{grid-template-columns:1fr}header{padding:15px;display:block}main{padding:14px}.records{max-height:240px}}
</style></head><body><header><div><h1>推理压缩 · 统一维护台</h1><small>在一个地方编辑，生成两个站点的同版内容</small></div><a href="/business_insight/cloud_core/index.html#view-topics" target="_blank">打开阅读预览 ↗</a></header><main><div class="status"><div class="pill">唯一内容源：<b>CCN-insight</b></div><div class="pill">内容版本：<b id="version">读取中</b></div><div class="pill" id="buildstate">检查待发布文件…</div><div class="pill">公开站点：<b>未切换</b></div></div><div class="layout"><aside class="panel"><h2>选择内容</h2><label for="topic">研究课题</label><select id="topic"><option value="">全部课题／通用内容</option></select><label for="table">内容类型</label><select id="table"></select><label for="search">搜索标题或内容</label><input id="search" placeholder="例如：权重、AWQ、KV Cache"><small id="count"></small><div class="records" id="records"></div></aside><section class="panel"><h2 id="heading">选择一条内容开始编辑</h2><p class="hint">保存后先检查字段和引用关系，再生成本地预览与两站待发布文件。这里没有公开发布操作。</p><div id="editor"><p class="muted">左侧可以选择课题正文、技术路线、引用、动态或报告。</p></div><div class="actions"><button id="save" disabled>保存并校验</button><button id="build">生成预览与两站文件</button><a href="/business_insight/cloud_core/index.html#view-home" target="_blank">查看洞察报告 ↗</a></div><div id="message" role="status"></div></section></div></main><script>
const $=id=>document.getElementById(id);let version='',selection=null,original=null;
const names={ic_compression_topic_cards:'课题研究卡片',ic_compression_topic_sections:'课题章节',ic_compression_research_routes:'技术路线',ic_compression_topics:'课题目录',ic_compression_topic_card_refs:'卡片文献引用',ic_compression_research_frames:'背景与挑战',ic_paper_summaries:'论文总结',ic_monthly_route_insights:'月度路线洞察',ic_industry_updates:'产业动态',ic_insight_reports:'报告目录',cloud_core_sources:'原始来源',ic_current_signals:'热点资讯'};
const labels={title_zh:'中文标题',body_zh:'正文',question_zh:'研究问题',why_zh:'研究背景',value_zh:'技术价值',challenge_zh:'技术挑战',problem_zh:'应对的挑战',principle_zh:'技术原理',step_1_zh:'第一步',step_2_zh:'第二步',step_3_zh:'第三步',tradeoff_zh:'收益与代价',summary_zh:'摘要',one_sentence_zh:'一句话总结',background_zh:'背景介绍',innovation_zh:'技术与创新点',results_zh:'效果总结',review_status:'审阅状态',reviewed_at:'复核日期',source_id:'来源 ID',canonical_url:'原文链接',title:'来源标题',position:'显示顺序',evidence_locator:'原文定位',claim_kind:'结论类型'};
async function api(path,body){const response=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const data=await response.json();if(!response.ok)throw Error(data.error||response.statusText);return data;}
function message(text,error=false){$('message').textContent=text;$('message').className=error?'error':'';}
async function status(){const data=await api('/api/status');version=data.version;$('version').textContent=version.replace('compression-','');$('buildstate').textContent=data.needs_build?'内容已更新，待生成预览':'两站待发布文件版本一致';}
async function list(){const table=$('table').value,topic=$('topic').value,q=$('search').value;const data=await api('/api/records?'+new URLSearchParams({table,topic,q}));$('records').replaceChildren();$('count').textContent='匹配 '+data.total+' 条'+(data.limited?'，显示前100条，请缩小范围':'');for(const record of data.records){const button=document.createElement('button');button.className='record';const title=document.createElement('span');title.textContent=record.label;const id=document.createElement('small');id.textContent=record.key;button.append(title,id);button.onclick=()=>open(table,record.key);$('records').append(button);}}
async function open(table,key){try{const data=await api('/api/record?'+new URLSearchParams({table,key}));selection={table,key,version:data.version};original=data.row;$('heading').textContent=names[table]||table;$('editor').replaceChildren();const protectedFields=[data.key_field,'business_id','topic_id'];const priority=['title_zh','question_zh','body_zh','summary_zh','one_sentence_zh','background_zh','innovation_zh','results_zh','why_zh','value_zh','challenge_zh','problem_zh','principle_zh','step_1_zh','step_2_zh','step_3_zh','tradeoff_zh'];const rank=k=>priority.includes(k)?priority.indexOf(k):k.endsWith('_en')?100:70;const fields=Object.keys(original).sort((a,b)=>rank(a)-rank(b));for(const key of fields){const block=document.createElement('div');block.className='field';const label=document.createElement('label');label.textContent=labels[key]||key;const help=document.createElement('small');help.textContent=labels[key]?key:'';block.append(label,help);if(protectedFields.includes(key)){const value=document.createElement('div');value.className='readonly';value.textContent=String(original[key]);block.append(value);}else{const input=document.createElement(typeof original[key]==='string'&&original[key].length>100?'textarea':'input');input.dataset.field=key;input.id='field-'+key;label.htmlFor=input.id;input.dataset.kind=typeof original[key];if(typeof original[key]==='object')input.dataset.kind='json';input.value=typeof original[key]==='object'?JSON.stringify(original[key]):String(original[key]);block.append(input);}$('editor').append(block);}$('save').disabled=false;message('正在编辑：'+key);}catch(error){message(error.message,true);}}
$('save').onclick=async()=>{if(!selection)return;const updates={};try{for(const input of $('editor').querySelectorAll('[data-field]')){let value=input.value;switch(input.dataset.kind){case 'number':if(!value.trim())throw Error('数字字段不能为空');value=Number(value);if(!Number.isFinite(value))throw Error('数字字段无效');break;case 'boolean':if(!['true','false'].includes(value))throw Error('布尔字段请使用 true 或 false');value=value==='true';break;case 'json':value=JSON.parse(value);break;}if(JSON.stringify(value)!==JSON.stringify(original[input.dataset.field]))updates[input.dataset.field]=value;}if(!Object.keys(updates).length){message('没有需要保存的修改。');return;}$('save').disabled=true;message('正在保存并检查引用…');const data=await api('/api/save',{...selection,expected_version:selection.version,updates});await status();await open(selection.table,selection.key);message('已保存并通过关联校验。生成预览后可检查两站内容。');}catch(error){message(error.message,true);}finally{$('save').disabled=false;}};
$('build').onclick=async()=>{try{$('build').disabled=true;message('正在检查内容、生成预览与两站待发布文件…');await api('/api/build',{expected_version:version});await status();message('两个站点的待发布文件已生成，内容版本一致。公开网站未更新。');}catch(error){message(error.message,true);}finally{$('build').disabled=false;}};
$('topic').onchange=()=>list().catch(e=>message(e.message,true));$('table').onchange=()=>list().catch(e=>message(e.message,true));let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>list().catch(e=>message(e.message,true)),300);};
(async()=>{await status();const data=await api('/api/catalog');for(const t of data.topics.sort((a,b)=>a.position-b.position)){const option=document.createElement('option');option.value=t.compression_topic_id;option.textContent=t.title_zh;$('topic').append(option);}data.tables.sort((a,b)=>Number(!names[a.name])-Number(!names[b.name])||a.name.localeCompare(b.name));for(const t of data.tables){const option=document.createElement('option');option.value=t.name;option.textContent=(names[t.name]||t.name)+' · '+t.count;$('table').append(option);}$('table').value='ic_compression_topic_cards';await list();})().catch(error=>message(error.message,true));
</script></body></html>
