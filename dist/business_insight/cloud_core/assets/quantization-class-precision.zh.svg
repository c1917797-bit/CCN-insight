<rect x="281" y="227" width="66" height="43" rx="7" fill="#205264" stroke="#6ef3e2" data-precision-width="2" data-bit-index="1"/>
<text x="400" y="343" font-size="34" fill="#6ef3e2" font-weight="600" text-anchor="middle" id="precision-code-count" data-bits="2" data-code-count="4">2 bit → 2² = 4种短码</text>
<text x="32" y="409" font-size="24" fill="#b5cce2" font-weight="400" >bit不是小数位数；码怎样对应权重，下一幕看映射。</text>
