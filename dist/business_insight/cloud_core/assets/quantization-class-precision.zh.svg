<text x="32" y="48" font-size="32" fill="#eff8ff" font-weight="600" >先看懂数值格式：bit是存储长度</text>
<text x="32" y="94" font-size="24" fill="#b5cce2" font-weight="400" >同样保存一个权重，表示长度可以不同。</text>
<text x="32" y="158" font-size="28" fill="#eff8ff" font-weight="400" >16 bit</text>
