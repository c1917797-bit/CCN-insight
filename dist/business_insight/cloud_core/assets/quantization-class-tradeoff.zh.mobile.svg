<text x="180" y="142" font-size="24" fill="#b5cce2" font-weight="400" text-anchor="middle" >4 × 16 bit → 4 × 2 bit</text>
<text x="20" y="197" font-size="24" fill="#b5cce2" font-weight="400" >保存的4个编号</text>
